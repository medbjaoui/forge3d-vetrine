# ── Nginx configuration – Forge3D Vitrine ────────────────────────────────────
# Serves the static React SPA with optimal caching, gzip and security headers.

# Client IP forwarded to the ForgeOria API (Cloudflare header, else peer address).
map $http_cf_connecting_ip $forgeoria_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80;
    listen [::]:80;

    server_name forge3d.tech www.forge3d.tech;

    root /usr/share/nginx/html;
    index index.html;

    # ── Charset & MIME ────────────────────────────────────────────────────────
    charset utf-8;

    # ── Gzip Compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.emailjs.com https://www.googletagmanager.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://api.emailjs.com https://formspree.io https://www.google-analytics.com https://www.facebook.com; frame-ancestors 'none';" always;

    # ── Health check endpoint (Docker HEALTHCHECK) ────────────────────────────
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Emit relative Location headers so redirects keep the public https scheme
    # behind the Cloudflare tunnel.
    absolute_redirect off;

    # ── Legacy product route ──────────────────────────────────────────────────
    location ~ ^/forgeassist(/.*)?$ {
        return 301 /forgeoria$is_args$args;
    }

    # ── ForgeOria private API (forgeoria-api:4000) ────────────────────────────
    # Docker embedded DNS + a variable upstream: nginx starts even when the
    # forgeoria-api alias does not exist yet; the name is resolved per request.
    # Only the public lead endpoint is exposed; admin/other routes stay private.
    location ^~ /api/autopilot/ {
        location = /api/autopilot/leads {
            limit_except POST { deny all; }
            client_max_body_size 16k;
            # Request bodies contain personal data: keep them out of access logs.
            access_log off;

            resolver 127.0.0.11 valid=30s ipv6=off;
            resolver_timeout 5s;
            set $forgeoria_api http://forgeoria-api:4000;
            rewrite ^/api/autopilot/(.*)$ /api/$1 break;
            proxy_pass $forgeoria_api;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $forgeoria_client_ip;
            proxy_set_header X-Forwarded-For $forgeoria_client_ip;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_buffering off;

            # Unreachable/unresolvable upstream -> explicit JSON 503.
            error_page 502 504 = @forgeoria_unavailable;
        }
        return 404;
    }

    location @forgeoria_unavailable {
        default_type application/json;
        return 503 '{"error":"service_unavailable"}';
    }

    # ── Backend API Proxy ─────────────────────────────────────────────────────
    # The contact administration endpoint is not part of the public website.
    location ^~ /api/contacts {
        return 404;
    }

    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;

        # Cloudflare envoie l'IP réelle dans CF-Connecting-IP
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        proxy_cache_bypass $http_upgrade;
    }

    # ── Static assets – long-term cache ──────────────────────────────────────
    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        expires 1y;
        access_log off;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        expires 6M;
        access_log off;
    }

    # ── SPA fallback – all routes serve index.html ────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;

        # Cache HTML briefly while preserving inherited security headers.
        expires 1h;
    }

    # ── robots.txt & sitemap ──────────────────────────────────────────────────
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location = /sitemap.xml {
        access_log off;
        log_not_found off;
    }

    # Serve canonical marketing routes directly. This avoids Nginx directory
    # redirects using the internal HTTP scheme behind the Cloudflare tunnel.
    location ~ ^/(about|company|forgeoria)$ {
        try_files $uri/index.html =404;
        expires 1h;
    }

    # ── Hide Nginx version ────────────────────────────────────────────────────
    server_tokens off;

    # ── Access logs ───────────────────────────────────────────────────────────
    access_log /var/log/nginx/vitrine.access.log;
    error_log /var/log/nginx/vitrine.error.log warn;
}
