# ── Nginx configuration – Forge3D Vitrine · ForgeOria STAGING ────────────────
# Static SPA + ForgeOria product API proxy (api:4000). The original contact
# backend is deliberately NOT proxied: staging must never reach email/SMTP.
# Everything is no-store and noindex.

map $http_cf_connecting_ip $forgeoria_client_ip {
    ""      $remote_addr;
    default $remote_addr;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml font/woff font/woff2;

    # ── Security + staging headers (no location below uses add_header, so
    #    these are inherited everywhere) ──────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self'; frame-ancestors 'none';" always;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /robots.txt {
        access_log off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # ── Legacy product route ──────────────────────────────────────────────────
    location ~ ^/forgeassist(/.*)?$ {
        return 301 /forgeoria$is_args$args;
    }

    # ── ForgeOria product API (staging service "api") ─────────────────────────
    location ^~ /api/autopilot/ {
        location = /api/autopilot/leads {
            limit_except POST { deny all; }
            client_max_body_size 16k;
            access_log off;

            resolver 127.0.0.11 valid=30s ipv6=off;
            resolver_timeout 5s;
            set $forgeoria_api http://api:4000;
            rewrite ^/api/autopilot/(.*)$ /api/$1 break;
            proxy_pass $forgeoria_api;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $forgeoria_client_ip;
            proxy_set_header X-Forwarded-For $forgeoria_client_ip;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_buffering off;

            error_page 502 504 = @forgeoria_unavailable;
        }
        return 404;
    }

    location @forgeoria_unavailable {
        default_type application/json;
        return 503 '{"error":"service_unavailable"}';
    }

    # ── Original contact API: disabled in staging ─────────────────────────────
    location /api/ {
        default_type application/json;
        return 503 '{"error":"contact_api_disabled_in_staging"}';
    }

    # ── Canonical marketing routes (pre-rendered shells) ──────────────────────
    location ~ ^/(about|company|forgeoria)$ {
        try_files $uri/index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /dev/stdout;
    error_log /dev/stderr warn;
}
